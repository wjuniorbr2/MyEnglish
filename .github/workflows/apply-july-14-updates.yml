name: Apply requested July 14 updates

on:
  push:
    paths:
      - '.github/workflows/apply-july-14-updates.yml'

permissions:
  contents: write

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply targeted changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def replace_first_n(path, old, new, n):
              text = read(path)
              count = text.count(old)
              if count < n:
                  raise RuntimeError(f'{path}: expected at least {n} matches, found {count}: {old!r}')
              write(path, text.replace(old, new, n))

          # 1) Let hint words wrap naturally instead of being squeezed vertically.
          hint_files = [
              ('app/src/main/java/com/example/myenglish/components/SentenceRow.kt',
               '@Composable\nfun SentenceRow(',
               '                    Row(modifier = Modifier.fillMaxWidth()) {',
               '                    FlowRow(modifier = Modifier.fillMaxWidth()) {'),
              ('app/src/main/java/com/example/myenglish/screens/WrittenHomeworkScreen.kt',
               '@Composable\nprivate fun WrittenCard(',
               '                    Row(Modifier.fillMaxWidth()) {',
               '                    FlowRow(Modifier.fillMaxWidth()) {'),
              ('app/src/main/java/com/example/myenglish/screens/SpokenHomeworkScreen.kt',
               '@Composable\nprivate fun SpokenSentenceCard(',
               '                Row(modifier = Modifier.fillMaxWidth()) {',
               '                FlowRow(modifier = Modifier.fillMaxWidth()) {'),
              ('app/src/main/java/com/example/myenglish/screens/PracticeScreen.kt',
               '@Composable\nprivate fun PracticeCard(',
               '                Row(Modifier.fillMaxWidth()) {',
               '                FlowRow(Modifier.fillMaxWidth()) {'),
              ('app/src/main/java/com/example/myenglish/screens/WrittenPracticeScreen.kt',
               '@Composable\nprivate fun WrittenPracticeCard(',
               '                Row(Modifier.fillMaxWidth()) {',
               '                FlowRow(Modifier.fillMaxWidth()) {'),
              ('app/src/main/java/com/example/myenglish/screens/ListeningPracticeScreen.kt',
               '@Composable\nprivate fun ListeningPracticeCard(',
               '                Row(Modifier.fillMaxWidth()) {',
               '                FlowRow(Modifier.fillMaxWidth()) {'),
          ]

          for path, composable_marker, old_row, new_row in hint_files:
              text = read(path)
              import_marker = 'import androidx.compose.foundation.layout.Column\n'
              if import_marker not in text:
                  raise RuntimeError(f'{path}: Column import marker missing')
              text = text.replace(
                  import_marker,
                  import_marker +
                  'import androidx.compose.foundation.layout.ExperimentalLayoutApi\n' +
                  'import androidx.compose.foundation.layout.FlowRow\n',
                  1
              )
              if composable_marker not in text:
                  raise RuntimeError(f'{path}: composable marker missing')
              text = text.replace(
                  composable_marker,
                  '@OptIn(ExperimentalLayoutApi::class)\n' + composable_marker,
                  1
              )
              if text.count(old_row) != 1:
                  raise RuntimeError(f'{path}: expected one hint Row, found {text.count(old_row)}')
              text = text.replace(old_row, new_row, 1)
              write(path, text)

          # 2) Keep the bug tab below the status bar and make it a normal floating button.
          bug_path = 'app/src/main/java/com/example/myenglish/components/BugReportOverlay.kt'
          bug = read(bug_path)
          bug = bug.replace(
              'import androidx.compose.foundation.layout.offset\n',
              'import androidx.compose.foundation.layout.statusBarsPadding\n',
              1
          )
          old_bug_block = '''    Box(
              modifier = Modifier.fillMaxWidth(),
              contentAlignment = Alignment.TopStart
          ) {
              Box(
                  modifier = Modifier
                      .offset(x = 10.dp, y = (-14).dp)
                      .width(47.dp)
                      .height(47.dp)
                      .shadow(
                          elevation = 8.dp,
                          shape = RoundedCornerShape(
                              topStart = 0.dp,
                              topEnd = 0.dp,
                              bottomStart = 16.dp,
                              bottomEnd = 16.dp
                          ),
                          clip = false
                      )
                      .background(
                          color = Color(0xFF111111),
                          shape = RoundedCornerShape(
                              topStart = 0.dp,
                              topEnd = 0.dp,
                              bottomStart = 16.dp,
                              bottomEnd = 16.dp
                          )
                      )
                      .clickable { showDialog = true },
          '''
          new_bug_block = '''    Box(
              modifier = Modifier
                  .fillMaxWidth()
                  .statusBarsPadding()
                  .padding(start = 10.dp, top = 8.dp),
              contentAlignment = Alignment.TopStart
          ) {
              Box(
                  modifier = Modifier
                      .width(47.dp)
                      .height(47.dp)
                      .shadow(
                          elevation = 8.dp,
                          shape = RoundedCornerShape(14.dp),
                          clip = false
                      )
                      .background(
                          color = Color(0xFF111111),
                          shape = RoundedCornerShape(14.dp)
                      )
                      .clickable { showDialog = true },
          '''
          if bug.count(old_bug_block) != 1:
              raise RuntimeError('BugReportOverlay.kt: expected button layout block not found')
          bug = bug.replace(old_bug_block, new_bug_block, 1)
          write(bug_path, bug)

          # 3) Raise only the two Go to lesson buttons (homework and practice).
          replace_first_n(
              'app/src/main/java/com/example/myenglish/screens/AppRoot.kt',
              '.padding(bottom = 18.dp),',
              '.padding(bottom = 72.dp),',
              2
          )

          # 4) Lessons 5-8 show numbers 1-20, with system TTS for each number and Play All.
          book_path = 'app/src/main/java/com/example/myenglish/screens/BookScreen.kt'
          book = read(book_path)
          old_data_end = '''        else -> Lesson1BookData
              }

              val context = LocalContext.current
          '''
          number_block = '''        else -> Lesson1BookData
              }

              val lessonNumber = lessonName.removePrefix("Lesson ").toIntOrNull()
              val useNumberSection = lessonNumber != null && lessonNumber in 5..8
              val numberItems = remember {
                  arrayOf(
                      BookAudioItem("1", "One", 0, 0, 0, true),
                      BookAudioItem("2", "Two", 0, 0, 0, true),
                      BookAudioItem("3", "Three", 0, 0, 0, true),
                      BookAudioItem("4", "Four", 0, 0, 0, true),
                      BookAudioItem("5", "Five", 0, 0, 0, true),
                      BookAudioItem("6", "Six", 0, 0, 0, true),
                      BookAudioItem("7", "Seven", 0, 0, 0, true),
                      BookAudioItem("8", "Eight", 0, 0, 0, true),
                      BookAudioItem("9", "Nine", 0, 0, 0, true),
                      BookAudioItem("10", "Ten", 0, 0, 0, true),
                      BookAudioItem("11", "Eleven", 0, 0, 0, true),
                      BookAudioItem("12", "Twelve", 0, 0, 0, true),
                      BookAudioItem("13", "Thirteen", 0, 0, 0, true),
                      BookAudioItem("14", "Fourteen", 0, 0, 0, true),
                      BookAudioItem("15", "Fifteen", 0, 0, 0, true),
                      BookAudioItem("16", "Sixteen", 0, 0, 0, true),
                      BookAudioItem("17", "Seventeen", 0, 0, 0, true),
                      BookAudioItem("18", "Eighteen", 0, 0, 0, true),
                      BookAudioItem("19", "Nineteen", 0, 0, 0, true),
                      BookAudioItem("20", "Twenty", 0, 0, 0, true)
                  )
              }
              val bottomTitle = if (useNumberSection) {
                  BookAudioItem("NUMBERS", "", 0, 0, 0, true)
              } else {
                  bookData.alphabetTitle
              }
              val bottomItems = if (useNumberSection) numberItems else bookData.alphabet

              val context = LocalContext.current
          '''
          if book.count(old_data_end) != 1:
              raise RuntimeError('BookScreen.kt: book data insertion marker not found')
          book = book.replace(old_data_end, number_block, 1)

          old_play_end = '''        currentPlayer.setOnCompletionListener { stop() }
              }

              DisposableEffect(Unit) {
          '''
          new_play_end = '''        currentPlayer.setOnCompletionListener { stop() }
              }

              fun playBottomItem(item: BookAudioItem) {
                  if (useNumberSection) {
                      stop()
                      speakText(item.translation, TextToSpeech.QUEUE_FLUSH, "book_number_${item.english}")
                  } else {
                      playSegment(item)
                  }
              }

              fun playBottomSection() {
                  if (!useNumberSection && bookData.alphabetAudioResId != 0) {
                      playFull(bookData.alphabetAudioResId)
                      return
                  }
                  if (!ttsReady) return

                  stop()
                  bottomItems.forEachIndexed { index, item ->
                      val spokenText = if (useNumberSection) item.translation else item.english
                      speakText(
                          spokenText,
                          if (index == 0) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD,
                          "book_bottom_$index"
                      )
                      textToSpeech.playSilentUtterance(
                          700L,
                          TextToSpeech.QUEUE_ADD,
                          "book_bottom_pause_$index"
                      )
                  }
              }

              DisposableEffect(Unit) {
          '''
          if book.count(old_play_end) != 1:
              raise RuntimeError('BookScreen.kt: play function insertion marker not found')
          book = book.replace(old_play_end, new_play_end, 1)

          old_bottom = '''                        .clickable { playSegment(bookData.alphabetTitle) }
                              .padding(horizontal = 10.dp, vertical = 5.dp)
                      ) {
                          Text(
                              text = "ALPHABET",
                              color = Color.White,
                              fontSize = 22.sp,
                              fontWeight = FontWeight.Black
                          )
                      }
                      ArtButton(
                          text = "▶ ABC",
                          onClick = { playFull(bookData.alphabetAudioResId) },
                          modifier = Modifier.width(95.dp),
                          heightDp = 46,
                          fontSize = 14
                      )
                  }
                  AlphabetGrid(bookData.alphabet, ::playSegment)
          '''
          new_bottom = '''                        .clickable { playSegment(bottomTitle) }
                              .padding(horizontal = 10.dp, vertical = 5.dp)
                      ) {
                          Text(
                              text = if (useNumberSection) "NUMBERS" else "ALPHABET",
                              color = Color.White,
                              fontSize = 22.sp,
                              fontWeight = FontWeight.Black
                          )
                      }
                      ArtButton(
                          text = if (useNumberSection) "▶ 1-20" else "▶ ABC",
                          onClick = { playBottomSection() },
                          modifier = Modifier.width(95.dp),
                          heightDp = 46,
                          fontSize = 14
                      )
                  }
                  AlphabetGrid(
                      items = bottomItems,
                      play = ::playBottomItem,
                      columns = if (useNumberSection) 5 else 7
                  )
          '''
          if book.count(old_bottom) != 1:
              raise RuntimeError('BookScreen.kt: bottom alphabet block not found')
          book = book.replace(old_bottom, new_bottom, 1)

          old_grid = '''private fun AlphabetGrid(items: Array<BookAudioItem>, play: (BookAudioItem) -> Unit) {
              var i = 0
              while (i < items.size) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      var col = 0
                      while (col < 7) {
                          val index = i + col
                          if (index < items.size) AlphabetCell(items[index], play) else Spacer(Modifier.width(42.dp))
                          col++
                      }
                  }
                  Spacer(Modifier.height(5.dp))
                  i += 7
              }
          }
          '''
          new_grid = '''private fun AlphabetGrid(
              items: Array<BookAudioItem>,
              play: (BookAudioItem) -> Unit,
              columns: Int = 7
          ) {
              var i = 0
              while (i < items.size) {
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly) {
                      var col = 0
                      while (col < columns) {
                          val index = i + col
                          if (index < items.size) AlphabetCell(items[index], play) else Spacer(Modifier.width(42.dp))
                          col++
                      }
                  }
                  Spacer(Modifier.height(5.dp))
                  i += columns
              }
          }
          '''
          if book.count(old_grid) != 1:
              raise RuntimeError('BookScreen.kt: AlphabetGrid function not found')
          book = book.replace(old_grid, new_grid, 1)
          write(book_path, book)

          # 5) Add an additive Google Apps Script helper. It leaves existing detailed student tabs untouched.
          weekly_summary = r'''var MY_ENGLISH_SUMMARY_SPREADSHEET_ID = "1smP3D6WXZKk6X8_MEfSBbp03r4hE8oKu4tobeo5tfKw";
          var MY_ENGLISH_SUMMARY_SHEET_NAME = "General";

          var MY_ENGLISH_SUMMARY_STUDENTS = [
            { display: "Vinícius", keys: ["vinicius"] },
            { display: "Ayla", keys: ["ayla"] },
            { display: "Yuri", keys: ["yuri"] },
            { display: "Kalil", keys: ["kalil"] },
            { display: "Beatriz D.", keys: ["beatriz d", "beatriz"] },
            { display: "Junior", keys: ["junior"] }
          ];

          var MY_ENGLISH_SUMMARY_TYPES = {
            "written homework": { column: 2, color: "#2E7D32", practice: false },
            "listening homework": { column: 3, color: "#1565C0", practice: false },
            "spoken homework": { column: 4, color: "#C62828", practice: false },
            "written practice": { column: 5, color: "#2E7D32", practice: true },
            "listening practice": { column: 5, color: "#1565C0", practice: true },
            "spoken practice": { column: 5, color: "#C62828", practice: true }
          };

          /**
           * Call this once from the existing doPost(e), after the detailed report
           * has been written and before doPost returns its response.
           *
           * Recommended safe call:
           * try {
           *   updateWeeklySummaryFromPost_(e);
           * } catch (summaryError) {
           *   console.error(summaryError);
           * }
           */
          function updateWeeklySummaryFromPost_(e) {
            var parameters = e && e.parameter ? e.parameter : {};
            var homeworkType = normalizeSummaryText_(parameters.homeworkType);
            var typeInfo = MY_ENGLISH_SUMMARY_TYPES[homeworkType];

            if (!typeInfo || homeworkType === "bug report") return;

            var studentIndex = findSummaryStudentIndex_(parameters.studentName);
            if (studentIndex < 0) return;

            var lessonMatch = String(parameters.lessonName || "").match(/\d+/);
            if (!lessonMatch) return;

            var lessonNumber = Number(lessonMatch[0]);
            if (!lessonNumber || lessonNumber < 1) return;

            var spreadsheet = SpreadsheetApp.openById(MY_ENGLISH_SUMMARY_SPREADSHEET_ID);
            var timeZone = spreadsheet.getSpreadsheetTimeZone() || Session.getScriptTimeZone() || "America/Sao_Paulo";
            var week = summaryWeekForDate_(new Date(), timeZone);
            var sheet = spreadsheet.getSheetByName(MY_ENGLISH_SUMMARY_SHEET_NAME);

            if (!sheet) {
              sheet = spreadsheet.insertSheet(MY_ENGLISH_SUMMARY_SHEET_NAME, 0);
              sheet.setHiddenGridlines(true);
            }

            var titleRow = findOrCreateSummaryWeekBlock_(sheet, week);
            var studentRow = titleRow + 2 + studentIndex;
            var targetCell = sheet.getRange(studentRow, typeInfo.column);

            addSummaryMarker_(
              targetCell,
              homeworkType,
              lessonNumber,
              typeInfo.color,
              typeInfo.practice
            );
          }

          function normalizeSummaryText_(value) {
            return String(value || "")
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, " ")
              .trim()
              .replace(/\s+/g, " ");
          }

          function findSummaryStudentIndex_(studentName) {
            var normalized = normalizeSummaryText_(studentName);

            for (var i = 0; i < MY_ENGLISH_SUMMARY_STUDENTS.length; i++) {
              var keys = MY_ENGLISH_SUMMARY_STUDENTS[i].keys;
              for (var j = 0; j < keys.length; j++) {
                if (normalized === keys[j]) return i;
              }
            }

            return -1;
          }

          function summaryWeekForDate_(date, timeZone) {
            var year = Number(Utilities.formatDate(date, timeZone, "yyyy"));
            var month = Number(Utilities.formatDate(date, timeZone, "MM"));
            var day = Number(Utilities.formatDate(date, timeZone, "dd"));
            var localDateOnly = new Date(Date.UTC(year, month - 1, day));
            var daysSinceSunday = localDateOnly.getUTCDay();

            var start = new Date(localDateOnly.getTime());
            start.setUTCDate(start.getUTCDate() - daysSinceSunday);

            var end = new Date(start.getTime());
            end.setUTCDate(end.getUTCDate() + 6);

            return {
              key: Utilities.formatDate(start, "UTC", "yyyy-MM-dd"),
              title: formatSummaryWeekTitle_(start, end)
            };
          }

          function formatSummaryWeekTitle_(start, end) {
            var months = [
              "January", "February", "March", "April", "May", "June",
              "July", "August", "September", "October", "November", "December"
            ];

            var startMonth = months[start.getUTCMonth()];
            var endMonth = months[end.getUTCMonth()];
            var startDay = start.getUTCDate();
            var endDay = end.getUTCDate();

            if (startMonth === endMonth) {
              return startMonth + " " + ordinalSummaryDay_(startDay) +
                " to " + startMonth + " " + ordinalSummaryDay_(endDay);
            }

            return startMonth + " " + ordinalSummaryDay_(startDay) +
              " to " + endMonth + " " + ordinalSummaryDay_(endDay);
          }

          function ordinalSummaryDay_(day) {
            var mod100 = day % 100;
            if (mod100 >= 11 && mod100 <= 13) return day + "th";

            switch (day % 10) {
              case 1: return day + "st";
              case 2: return day + "nd";
              case 3: return day + "rd";
              default: return day + "th";
            }
          }

          function findOrCreateSummaryWeekBlock_(sheet, week) {
            var lastRow = sheet.getLastRow();

            for (var row = 1; row <= lastRow; row++) {
              if (sheet.getRange(row, 1).getNote() === "myenglish-week:" + week.key) {
                return row;
              }
            }

            var titleRow = lastRow === 0 ? 1 : lastRow + 2;
            var titleRange = sheet.getRange(titleRow, 1, 1, 5);
            titleRange.merge();
            titleRange
              .setValue(week.title)
              .setNote("myenglish-week:" + week.key)
              .setFontWeight("bold")
              .setFontSize(13)
              .setHorizontalAlignment("center")
              .setVerticalAlignment("middle")
              .setBackground("#0D3D7A")
              .setFontColor("#FFFFFF");

            sheet.setRowHeight(titleRow, 32);

            var headerRow = titleRow + 1;
            sheet.getRange(headerRow, 1, 1, 5)
              .setValues([[
                "Student",
                "Written homework",
                "Listening homework",
                "Spoken homework",
                "Practices"
              ]])
              .setFontWeight("bold")
              .setHorizontalAlignment("center")
              .setVerticalAlignment("middle")
              .setWrap(true)
              .setBackground("#D9EAF7");

            sheet.setRowHeight(headerRow, 38);

            var studentRows = [];
            for (var i = 0; i < MY_ENGLISH_SUMMARY_STUDENTS.length; i++) {
              studentRows.push([MY_ENGLISH_SUMMARY_STUDENTS[i].display, "", "", "", ""]);
            }

            var studentsRange = sheet.getRange(
              titleRow + 2,
              1,
              MY_ENGLISH_SUMMARY_STUDENTS.length,
              5
            );

            studentsRange
              .setValues(studentRows)
              .setVerticalAlignment("middle")
              .setWrap(true)
              .setBorder(true, true, true, true, true, true, "#B7C9D6", SpreadsheetApp.BorderStyle.SOLID);

            sheet.getRange(titleRow + 2, 1, MY_ENGLISH_SUMMARY_STUDENTS.length, 1)
              .setFontWeight("bold");

            for (var studentRow = titleRow + 2; studentRow < titleRow + 2 + MY_ENGLISH_SUMMARY_STUDENTS.length; studentRow++) {
              sheet.setRowHeight(studentRow, 34);
            }

            sheet.setColumnWidth(1, 125);
            sheet.setColumnWidth(2, 120);
            sheet.setColumnWidth(3, 120);
            sheet.setColumnWidth(4, 120);
            sheet.setColumnWidth(5, 330);

            return titleRow;
          }

          function addSummaryMarker_(cell, type, lessonNumber, color, isPractice) {
            var events = [];
            var note = cell.getNote();

            if (note && note.indexOf("myenglish-events:") === 0) {
              try {
                events = JSON.parse(note.substring("myenglish-events:".length));
              } catch (ignored) {
                events = [];
              }
            }

            if (!isPractice) {
              for (var i = 0; i < events.length; i++) {
                if (events[i].type === type && events[i].lesson === lessonNumber) return;
              }
            }

            events.push({ type: type, lesson: lessonNumber, color: color });
            cell.setNote("myenglish-events:" + JSON.stringify(events));
            renderSummaryMarkers_(cell, events);
          }

          function renderSummaryMarkers_(cell, events) {
            var text = "";
            var styleRanges = [];

            for (var i = 0; i < events.length; i++) {
              if (i > 0) text += "  ";

              var marker = circledSummaryNumber_(events[i].lesson);
              var start = text.length;
              text += marker;
              var end = text.length;

              styleRanges.push({
                start: start,
                end: end,
                color: events[i].color
              });
            }

            var builder = SpreadsheetApp.newRichTextValue().setText(text);

            for (var j = 0; j < styleRanges.length; j++) {
              var style = SpreadsheetApp.newTextStyle()
                .setForegroundColor(styleRanges[j].color)
                .setBold(true)
                .setFontSize(14)
                .build();

              builder.setTextStyle(styleRanges[j].start, styleRanges[j].end, style);
            }

            cell
              .setRichTextValue(builder.build())
              .setHorizontalAlignment("center")
              .setVerticalAlignment("middle")
              .setWrap(true);
          }

          function circledSummaryNumber_(number) {
            var circled = [
              "", "①", "②", "③", "④", "⑤", "⑥", "⑦", "⑧", "⑨", "⑩",
              "⑪", "⑫", "⑬", "⑭", "⑮", "⑯", "⑰", "⑱", "⑲", "⑳",
              "㉑", "㉒", "㉓", "㉔", "㉕", "㉖", "㉗", "㉘", "㉙", "㉚",
              "㉛", "㉜", "㉝", "㉞", "㉟", "㊱", "㊲", "㊳", "㊴", "㊵",
              "㊶", "㊷", "㊸", "㊹", "㊺", "㊻", "㊼", "㊽", "㊾", "㊿"
            ];

            return number >= 1 && number < circled.length ? circled[number] : "(" + number + ")";
          }
          '''
          write('google-apps-script/WeeklySummary.gs', textwrap.dedent(weekly_summary).lstrip())

          readme = '''# Weekly general report tab

          `WeeklySummary.gs` is an additive helper for the existing MyEnglish Google Apps Script.
          It does not replace or alter the detailed student tabs or the `Bug Reports` tab.

          ## Install it in the existing Apps Script project

          1. Open the Apps Script project currently used by the app.
          2. Add a new script file named `WeeklySummary` and paste the contents of `WeeklySummary.gs`.
          3. In the existing `doPost(e)`, after the detailed student report has been written and before the response is returned, add:

             ```javascript
             try {
               updateWeeklySummaryFromPost_(e);
             } catch (summaryError) {
               console.error(summaryError);
             }
             ```

          4. Save the project.
          5. Open **Deploy > Manage deployments**, edit the current web-app deployment, select **New version**, and deploy it. Updating the current deployment keeps the endpoint used by the Android app.

          ## Result

          The helper creates a `General` tab only when the first homework or practice report arrives for a Sunday-Saturday week. Each block contains the fixed students Vinícius, Ayla, Yuri, Kalil, Beatriz D., and Junior.

          - Written homework: green circled lesson number
          - Listening homework: blue circled lesson number
          - Spoken homework: red circled lesson number
          - Practices: all colored circled lesson numbers in one wider cell

          Unknown student names and bug reports are ignored by the `General` tab while the existing detailed-report logic continues normally.
          '''
          write('google-apps-script/README.md', textwrap.dedent(readme).lstrip())
          PY

      - name: Compile Kotlin
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit requested changes and remove one-time workflow
        shell: bash
        run: |
