name: Apply MyEnglish requested fixes

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  apply-and-build:
    if: github.event.issue.title == '[automation] Apply MyEnglish report lesson 5 keyboard fixes'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/report-lesson5-keyboard-fixes
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Apply source changes
        shell: bash
        run: |
          mkdir -p tools
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = """"""
          Path("tools/apply-report-lesson5-keyboard-fixes.py").write_bytes(
              gzip.decompress(base64.b64decode(encoded))
          )
          PY
          python3 tools/apply-report-lesson5-keyboard-fixes.py

      - name: Check Apps Script syntax
        shell: bash
        run: |
          cp google-apps-script/MyEnglishAPI.gs /tmp/MyEnglishAPI.js
          node --check /tmp/MyEnglishAPI.js

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Commit completed fixes
        shell: bash
        run: |
          rm -f tools/apply-report-lesson5-keyboard-fixes.py
          rm -f .github/workflows/apply-report-lesson5-keyboard-fixes.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Fix practice reports, lesson 5 audio, and keyboard focus"
          git push origin HEAD:agent/report-lesson5-keyboard-fixes
