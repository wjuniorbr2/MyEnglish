name: Trigger requested July 14 updates

on:
  push:
    paths:
      - '.github/july-14-update-trigger.txt'

permissions:
  contents: write

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Run embedded update script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow_path = Path('.github/workflows/apply-july-14-updates.yml')
          lines = workflow_path.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          embedded = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(embedded, str(workflow_path), 'exec'))
          PY

      - name: Compile Kotlin
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit requested changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-july-14-updates.yml
          rm -f .github/workflows/trigger-july-14-updates.yml
          rm -f .github/july-14-update-trigger.txt
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve homework UI, number audio, and weekly reports"
          git push origin master
