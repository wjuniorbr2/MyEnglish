name: Trigger requested July 14 updates

on:
  push:
    paths:
      - '.github/july-14-update-trigger.txt'

permissions:
  contents: write

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Apply requested source changes
        shell: bash
        run: |
          git apply --check .github/july-14-app-updates.patch
          git apply .github/july-14-app-updates.patch

      - name: Compile Kotlin
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Commit requested changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-july-14-updates.yml
          rm -f .github/workflows/trigger-july-14-updates.yml
          rm -f .github/july-14-update-trigger.txt
          rm -f .github/july-14-app-updates.patch
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve homework UI, number audio, and weekly reports"
          git push origin master
